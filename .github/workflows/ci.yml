name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Offline packet parser self-check
        run: python src/capture.py
      - name: Offline TUI self-check
        run: python src/tui.py --selfcheck
      - name: Offline static and mock verification
        run: bash scripts/verify.sh --offline
